<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"kicker","type":"string","label":"Surtitre","default":"ANALYSE AU RALENTI"},
    {"id":"title","type":"string","label":"Technique","default":"HIGH KICK"},
    {"id":"tag","type":"string","label":"Discipline","default":"COMBAT • ANATOMIE • PLACEMENT"},
    {"id":"handle","type":"string","label":"Compte","default":"@capoeirajacobina"},
    {"id":"accent","type":"color","label":"Accent","default":"#39ff14"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>AutoVid intro</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        src: url("fonts/Anton-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Permanent Marker";
        src: url("fonts/PermanentMarker-Regular.ttf") format("truetype");
      }
      body {
        margin: 0;
        background: #050608;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 70% at 50% 42%, #14181f 0%, #050608 70%);
        font-family: "Anton", sans-serif;
        color: #fff;
      }
      /* sol en perspective : grille néon qui défile vers le spectateur */
      .stage {
        position: absolute;
        inset: 0;
        perspective: 900px;
        perspective-origin: 50% 38%;
      }
      .floor {
        position: absolute;
        left: -50%;
        width: 200%;
        top: 52%;
        height: 140%;
        transform-origin: 50% 0%;
        background-image:
          linear-gradient(var(--accent) 2px, transparent 2px),
          linear-gradient(90deg, var(--accent) 2px, transparent 2px);
        background-size: 120px 120px;
        opacity: 0.35;
        mask-image: linear-gradient(to bottom, #000 0%, transparent 75%);
      }
      .glow {
        position: absolute;
        left: 0;
        right: 0;
        top: 49%;
        height: 6px;
        background: var(--accent);
        box-shadow: 0 0 40px 12px var(--accent);
        transform-origin: 50% 50%;
      }
      .titles {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        perspective: 1200px;
        padding-bottom: 260px;
      }
      .kicker {
        display: block;
        font-size: 64px;
        letter-spacing: 6px;
        color: #ffe600;
        text-shadow: 0 6px 18px rgba(0, 0, 0, 0.8);
      }
      .title {
        display: block;
        font-size: 190px;
        line-height: 0.95;
        text-align: center;
        max-width: 980px;
        letter-spacing: 2px;
        text-shadow:
          0 0 30px var(--accent),
          0 14px 0 #000,
          0 22px 40px rgba(0, 0, 0, 0.9);
      }
      .tag {
        display: block;
        font-family: "Permanent Marker", cursive;
        font-size: 46px;
        color: var(--accent);
      }
      .handle {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 170px;
        text-align: center;
        font-size: 48px;
        letter-spacing: 3px;
        color: rgba(255, 255, 255, 0.75);
      }
      .flash {
        pointer-events: none;
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="intro" data-start="0" data-width="1080" data-height="1920" data-duration="2.4">
      <div id="intro-scene" style="position:absolute;inset:0">
        <div class="stage"><div id="floor" class="floor"></div></div>
        <div id="glow" class="glow"></div>
        <div class="titles">
          <span id="kicker" class="kicker" data-var-text="kicker">ANALYSE AU RALENTI</span>
          <span id="title" class="title" data-var-text="title">HIGH KICK</span>
          <span id="tag" class="tag" data-var-text="tag">COMBAT • ANATOMIE • PLACEMENT</span>
        </div>
        <div id="handle" class="handle" data-var-text="handle">@capoeirajacobina</div>
        <div id="flash" class="flash"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // sol 3D : bascule puis défilement continu
      tl.fromTo("#floor", { rotationX: 88, backgroundPositionY: 0 }, { rotationX: 72, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo("#floor", { backgroundPositionY: "0px" }, { backgroundPositionY: "480px", duration: 2.4, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#glow", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.05);
      // titre : retournement 3D + zoom, comme un impact
      tl.fromTo("#kicker", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.fromTo(
        "#title",
        { rotationX: -95, scale: 1.6, opacity: 0, transformPerspective: 1200 },
        { rotationX: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" },
        0.35,
      );
      tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, 0.62);
      tl.fromTo("#title", { x: -14 }, { x: 0, duration: 0.25, ease: "elastic.out(1, 0.3)", immediateRender: false }, 0.62);
      tl.fromTo("#tag", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.85);
      tl.fromTo("#handle", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.0);
      // sortie : poussée vers l'avant + flash, raccord avec la vidéo
      tl.to("#title", { scale: 1.12, duration: 0.5, ease: "power2.in" }, 1.9);
      tl.to("#flash", { opacity: 1, duration: 0.12, ease: "power1.in" }, 2.28);
      window.__timelines["intro"] = tl;
    </script>
  </body>
</html>

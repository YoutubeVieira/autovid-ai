name: Démo en ligne

on:
  push:
    branches: [main]
    paths: ["second-souffle-pwa/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Garder seulement ce qui sert à l'application
        run: |
          mkdir site
          cp -r second-souffle-pwa/index.html second-souffle-pwa/sw.js second-souffle-pwa/manifest.webmanifest \
                second-souffle-pwa/css second-souffle-pwa/js second-souffle-pwa/icons second-souffle-pwa/img site/
          rm -f site/js/gemini.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

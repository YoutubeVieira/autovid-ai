<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Néon Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen night city canvas; HUD in the corners while playing; menus as scrolling overlays */
:root{
  --night:#0d0b1a; --ink:#f3eefe; --muted:#a79ccc; --panel:rgba(17,13,36,.86); --panel2:#1a1433; --line:rgba(255,255,255,.12);
  --magenta:#ff2e93; --cyan:#21e6ff; --amber:#ffb627; --lime:#a6ff4d; --danger:#ff4d5e; --gold:#ffd700;
  --display:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --body:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none}
#game,#game3d{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;pointer-events:none;z-index:5}
body:not(.playing) .hud, body:not(.playing) #mini{display:none!important}
#hudL{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:5px}
#money{font-family:var(--display);font-size:clamp(20px,3.6vw,30px);color:var(--amber);text-shadow:0 0 12px rgba(255,182,39,.5),0 2px 0 #000;font-variant-numeric:tabular-nums}
#stars{display:flex;gap:3px;font-size:21px;line-height:1}
#stars span{color:rgba(255,255,255,.18);text-shadow:0 1px 0 #000}
#stars span.on{color:var(--ink);text-shadow:0 0 10px var(--cyan)}
#stars.blink span.on{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{color:var(--magenta);text-shadow:0 0 10px var(--magenta)}}
.barw{width:160px;height:8px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:5px;overflow:hidden}
#hp{height:100%;background:linear-gradient(90deg,var(--magenta),var(--amber));transition:width .2s}
#armor{height:100%;background:linear-gradient(90deg,#2e6bff,var(--cyan));transition:width .2s}
#wep{font-family:var(--display);font-size:12px;color:var(--cyan);letter-spacing:.04em;margin-top:2px}
#inv{font-size:12px;color:var(--muted)}
#mini{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:150px;height:150px;border:2px solid rgba(33,230,255,.5);border-radius:10px;box-shadow:0 0 18px rgba(33,230,255,.25);background:#0a0816;z-index:5;pointer-events:none}
#step{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px 10px;text-align:center;width:min(420px,calc(100vw - 400px));min-width:240px}
#lvlName{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#sN{font-family:var(--display);font-size:13px;color:var(--cyan);letter-spacing:.04em;margin-top:2px}
#sD{font-size:14px;margin-top:2px;text-wrap:balance}
#sC{font-family:var(--display);font-size:18px;color:var(--amber);font-variant-numeric:tabular-nums}
#sC:empty{display:none}
#dots{display:flex;gap:4px;justify-content:center;margin-top:6px}
#dots i{width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
#dots i.d{background:var(--lime)}#dots i.c{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#vipBar{top:calc(170px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:150px;font-size:11px;color:var(--gold);font-family:var(--display);letter-spacing:.04em}
#vipBar .barw{width:150px;margin-top:3px}#vipHp{height:100%;background:var(--gold)}
#toast{top:34%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(15px,2.6vw,22px);text-align:center;text-shadow:0 0 14px var(--magenta),0 2px 0 #000;opacity:0;transition:opacity .25s;max-width:90vw}
#banner{top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(44px,10vw,96px);color:var(--magenta);text-shadow:0 0 30px var(--magenta),0 4px 0 #000;opacity:0;transition:opacity .3s;white-space:nowrap;z-index:12}
#prompt{bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;background:rgba(0,0,0,.65);border:1px solid var(--line);padding:6px 12px;border-radius:8px;white-space:nowrap;color:var(--amber)}
#fade{position:fixed;inset:0;z-index:8;background:#000;display:grid;place-items:center;font-family:var(--display);color:var(--amber);font-size:22px;opacity:0;transition:opacity .45s;pointer-events:none}
@media (max-width:760px){
  #mini{width:96px;height:96px}
  #vipBar{top:calc(116px + env(safe-area-inset-top,0px));width:96px}#vipBar .barw{width:96px}
  #step{top:auto;bottom:calc(160px + env(safe-area-inset-bottom,0px));width:calc(100vw - 32px);min-width:0;padding:6px 10px 8px}
  #sD{font-size:13px}
  .barw{width:120px}
  body.touch #prompt{bottom:calc(350px + env(safe-area-inset-bottom,0px))}
  body.touch #step{bottom:calc(238px + env(safe-area-inset-bottom,0px))}
}
/* commandes tactiles */
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:50%;height:60%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(33,230,255,.45);background:rgba(33,230,255,.07);left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px))}
#stickKnob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(33,230,255,.55);left:34px;top:34px;box-shadow:0 0 16px rgba(33,230,255,.6)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid;font-family:var(--display);font-size:10px;display:grid;place-items:center;color:var(--ink);background:rgba(0,0,0,.4);text-align:center;line-height:1.1}
#bShoot{width:80px;height:80px;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));border-color:var(--magenta);box-shadow:0 0 14px rgba(255,46,147,.4)}
#bAct{width:62px;height:62px;right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));border-color:var(--amber)}
#bWep{width:52px;height:52px;right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px));border-color:var(--cyan)}
#bMed{width:48px;height:48px;right:calc(98px + env(safe-area-inset-right,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px));border-color:var(--lime)}
#bNitro{width:52px;height:52px;right:calc(158px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));border-color:#9d7bff}
#bBribe{width:58px;height:58px;right:calc(186px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));border-color:var(--gold);color:var(--gold)}
#bCam{width:42px;height:42px;right:calc(80px + env(safe-area-inset-right,0px));bottom:calc(186px + env(safe-area-inset-bottom,0px));border-color:var(--cyan);font-size:10px}
#bPause{width:42px;height:42px;right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(186px + env(safe-area-inset-bottom,0px));border-color:var(--line);font-size:14px}
.tbtn:active{background:rgba(255,255,255,.18)}
/* écrans */
#screen{position:fixed;inset:0;z-index:10;overflow:auto;background:radial-gradient(ellipse at 50% 120%,rgba(255,46,147,.28),transparent 60%),rgba(9,7,20,.9);padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:text;user-select:text}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap.narrow{max-width:620px}
.center-col{align-items:center;text-align:center;justify-content:center;min-height:calc(100% - 20px)}
.home{align-items:center;text-align:center;padding-top:2vh}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(56px,13vw,112px);line-height:.88;margin:0;text-shadow:0 0 8px #fff,0 0 22px var(--magenta),0 0 44px var(--magenta)}
.logo span{color:var(--cyan);text-shadow:0 0 8px #fff,0 0 22px var(--cyan),0 0 44px var(--cyan)}
.lead{font-size:16px;color:var(--muted);margin:0;max-width:56ch;line-height:1.5;text-wrap:balance}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.col{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.btn{font-family:var(--display);font-size:15px;letter-spacing:.03em;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 20px;cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
.btn:hover{border-color:rgba(255,255,255,.3)}
.btn:focus-visible,.lvl:focus-visible,.tabs button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn.primary{background:var(--amber);color:#170c1f;border-color:transparent;box-shadow:0 0 24px rgba(255,182,39,.35)}
.btn.gold{background:linear-gradient(180deg,#ffe36b,#e0a800);color:#1d1300;border-color:transparent}
.btn.small{font-size:12px;padding:8px 12px}
.stats{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:14px;max-width:460px;width:100%}
.keys b{font-family:var(--display);font-weight:400;font-size:11px;color:var(--amber);letter-spacing:.04em;align-self:center;white-space:nowrap}
body.touch .keys{display:none}
.legal{font-size:11px;color:rgba(167,156,204,.7);margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h2{font-family:var(--display);font-weight:400;font-size:clamp(18px,3vw,26px);margin:0;flex:1;text-align:center;min-width:0}
.pill{font-family:var(--display);font-size:14px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.4);border:1px solid var(--line)}
.pill.money{color:var(--amber);font-variant-numeric:tabular-nums}
.region{--acc:var(--magenta);border-top:2px solid var(--acc);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.rhead h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0;color:var(--acc)}
.rhead span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.rhead p{flex-basis:100%;margin:0;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lvl{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;color:var(--ink);font-family:var(--body);cursor:pointer;min-height:112px}
.lvl .num{font-family:var(--display);font-size:24px;color:var(--acc);line-height:1}
.lvl .lt{font-weight:700;font-size:14px;line-height:1.2}
.lvl .tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lvl .rw{font-size:12px;color:var(--amber);margin-top:auto;font-variant-numeric:tabular-nums}
.lvl.open{border-color:var(--acc)}
.lvl.done .tag{color:var(--lime)}
.lvl.paid .tag{color:var(--gold)}
.lvl.locked{opacity:.45}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,var(--cyan));margin:0}
.title{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);margin:0;line-height:1.05;text-wrap:balance}
.title.big{color:var(--lime);text-shadow:0 0 22px rgba(166,255,77,.5)}
.title.fail{color:var(--danger);text-shadow:0 0 22px rgba(255,77,94,.5)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.steps li{counter-increment:s;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
.steps li::before{content:counter(s);font-family:var(--display);color:var(--acc,var(--cyan));margin-right:8px;font-size:12px}
.info{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted)}
.info b{color:var(--ink)}
.tabs{display:flex;gap:6px}
.tabs button{font-family:var(--display);font-size:13px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.tabs button.on{background:var(--cyan);color:#06121a;border-color:transparent}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item>div{min-width:0}
.item h4{margin:0;font-family:var(--display);font-weight:400;font-size:14px}
.item p{margin:3px 0 6px;font-size:13px;color:var(--muted)}
.item.is-locked{opacity:.55}
.stat{height:4px;width:120px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:4px;overflow:hidden}
.stat i{display:block;height:100%;background:var(--magenta)}.stat.r i{background:var(--cyan)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin:0}
.legend span{display:inline-block;width:14px;height:4px;border-radius:2px}.k1{background:var(--magenta)}.k2{background:var(--cyan);margin-left:10px}
.lock{font-size:12px;color:var(--muted);white-space:nowrap}
.eq{font-size:12px;color:var(--lime);white-space:nowrap;font-weight:700}
.feat{margin:0;padding-left:20px;line-height:1.8;font-size:15px}
.price{font-family:var(--display);font-size:40px;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,.4)}
.lab{font-size:14px;color:var(--muted);margin-top:8px}
input{font:inherit;font-size:16px;background:#0d0a1d;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;flex:1;min-width:0;letter-spacing:.06em;text-transform:uppercase}
.note{font-size:14px;color:var(--muted);margin:0}.note.ok{color:var(--lime)}.note.bad{color:var(--danger)}
.flash{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--danger);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;z-index:20}
/* téléphone */
html,body{touch-action:manipulation;overscroll-behavior:none}
@media (max-width:560px){.top h2{font-size:16px;flex-basis:100%;order:-1}}
@media (max-height:500px) and (orientation:landscape){
  #mini{width:84px;height:84px;top:calc(8px + env(safe-area-inset-top,0px))}
  #hudL{top:calc(8px + env(safe-area-inset-top,0px));gap:3px}
  #money{font-size:18px}#stars{font-size:15px}.barw{width:110px;height:6px}#wep{font-size:10px}#inv{display:none}
  #step{top:calc(6px + env(safe-area-inset-top,0px));bottom:auto;width:min(340px,calc(100vw - 330px));min-width:0;padding:4px 10px 6px}
  #lvlName{display:none}#sN{font-size:11px}#sD{font-size:12px}#sC{font-size:14px}#dots{margin-top:3px}
  #vipBar{top:calc(98px + env(safe-area-inset-top,0px));width:84px}#vipBar .barw{width:84px}
  #toast{top:26%;font-size:15px}
  body.touch #prompt{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #stickBase{width:104px;height:104px}#stickKnob{left:26px;top:26px}
  .logo{font-size:52px}.home{gap:10px;padding-top:0}
}
#tip{bottom:calc(64px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(520px,calc(100vw - 32px));background:rgba(33,230,255,.14);border:1px solid rgba(33,230,255,.6);box-shadow:0 0 18px rgba(33,230,255,.3);color:var(--ink);font-size:15px;line-height:1.4;padding:10px 14px;border-radius:12px;text-align:center;backdrop-filter:blur(4px)}
body.touch #tip{bottom:calc(300px + env(safe-area-inset-bottom,0px))}
#reward{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-20px);opacity:0;transition:transform .35s,opacity .35s;z-index:15;background:linear-gradient(180deg,#2a1f00,#140f00);border:1px solid var(--gold);border-radius:12px;padding:10px 18px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 0 26px rgba(255,215,0,.35);pointer-events:none;text-align:center}
#reward.in{opacity:1;transform:translate(-50%,0)}
#reward b{font-family:var(--display);font-weight:400;font-size:12px;color:var(--gold);letter-spacing:.06em}#reward span{font-size:16px;font-weight:700}#reward i{font-style:normal;color:var(--lime);font-weight:700}
.bigstars{font-size:46px;color:var(--gold);letter-spacing:6px;text-shadow:0 0 18px rgba(255,215,0,.5);line-height:1}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.crit li::before{content:'☆ ';color:var(--muted)}.crit li.ok{color:var(--ink)}.crit li.ok::before{content:'★ ';color:var(--gold)}
.offer{display:flex;flex-direction:column;gap:8px;align-items:center;background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.45);border-radius:14px;padding:14px 16px;max-width:460px}
.offer b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--gold)}.offer span{font-size:14px;color:var(--muted)}
.lvl .st{color:var(--gold);font-size:13px;letter-spacing:2px}
.daily{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.daily .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.daily .dh b{font-family:var(--display);font-weight:400;font-size:13px;color:var(--cyan)}.daily .dh span{font-size:12px;color:var(--muted)}
.dl{display:grid;grid-template-columns:1fr 70px auto;gap:10px;align-items:center;font-size:14px}.dl em{font-style:normal;font-size:12px;color:var(--muted);min-width:34px;text-align:right}.dl.ok span{color:var(--lime)}.dl.ok em{color:var(--lime)}
.pbar{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime))}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.ach .a{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.ach .a>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ach .a b{font-size:14px}.ach .a span{font-size:12px;color:var(--muted)}.ach .a em{font-style:normal;font-size:12px;color:var(--amber);white-space:nowrap}.ach .a.ok{border-color:rgba(166,255,77,.5)}.ach .a.ok em{color:var(--lime);font-size:16px}
.wardrobe{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
#outfitPrev{background:radial-gradient(circle at 50% 40%,rgba(33,230,255,.18),transparent 70%),var(--panel2);border:1px solid var(--line);border-radius:14px;width:180px;height:250px;position:sticky;top:0}
.cats{display:flex;flex-direction:column;gap:12px;min-width:0}.cat b{display:block;font-family:var(--display);font-weight:400;font-size:12px;color:var(--cyan);margin-bottom:6px;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.4);display:inline-block}
.chip small{color:var(--amber);font-size:11px}.chip.on{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(33,230,255,.35)}
@media (max-width:560px){.wardrobe{grid-template-columns:1fr;justify-items:center}#outfitPrev{position:static}}
@media (prefers-reduced-motion:reduce){#stars.blink span.on{animation:none}}
</style>
</head>
<body>

<canvas id="game"></canvas>
<canvas id="game3d" style="display:none"></canvas>
<canvas id="mini" width="164" height="164"></canvas>

<div class="hud" id="hudL">
  <div id="money">0 $</div>
  <div id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
  <div class="barw" title="Santé"><div id="hp"></div></div>
  <div class="barw" title="Armure"><div id="armor"></div></div>
  <div id="wep">Pistolet</div>
  <div id="inv"></div>
</div>
<div class="hud" id="step"><div id="lvlName"></div><div id="sN"></div><div id="sD"></div><div id="sC"></div><div id="dots"></div></div>
<div class="hud" id="vipBar" hidden>VIP<div class="barw"><div id="vipHp"></div></div></div>
<div class="hud" id="toast"></div>
<div class="hud" id="banner"></div>
<div class="hud" id="prompt" hidden></div>
<div id="fade"></div>
<div class="hud" id="tip" hidden></div>
<div id="reward" hidden></div>

<div id="touch" hidden>
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div class="tbtn" id="bShoot">TIRER</div>
  <div class="tbtn" id="bAct">ACTION</div>
  <div class="tbtn" id="bWep">ARME</div>
  <div class="tbtn" id="bMed">SOIN</div>
  <div class="tbtn" id="bNitro" hidden>NITRO</div>
  <div class="tbtn" id="bBribe" hidden>PAYER<br>FLICS</div>
  <div class="tbtn" id="bPause">II</div>
  <div class="tbtn" id="bCam">CAM</div>
</div>

<div id="screen"></div>

<script src="vendor/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>

<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
